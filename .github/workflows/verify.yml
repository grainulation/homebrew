name: Verify formulas
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed:
    name: Reviewed recipe / ${{ matrix.app }} / macOS ARM64
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: irrigator
            version: "1.2.0"
          - app: grainulator
            version: "3.0.1"
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      APP: ${{ matrix.app }}
      EXPECTED_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Ruby syntax
        run: ruby -c "Formula/$APP.rb"
      - name: Register exact reviewed local tap
        run: brew tap grainulation/homebrew "$GITHUB_WORKSPACE"
      - name: Install published archive through reviewed recipe
        run: |
          brew install "grainulation/homebrew/$APP"
          if [ "$APP" = irrigator ]; then
            app_prefix=$(brew --prefix "grainulation/homebrew/$APP")
            ruby -rjson -rdigest -e 'prefix = ARGV.fetch(0); provenance = JSON.parse(File.read("#{prefix}/share/irrigator/provenance.json")); abort "Installed Irrigator bytes differ from archive provenance" unless Digest::SHA256.file("#{prefix}/bin/irrigator").hexdigest == provenance.fetch("binary_sha256"); puts "PASS installed Irrigator binary matches archive provenance"' "$app_prefix"
          fi
          brew test --verbose "grainulation/homebrew/$APP"
          test "$("$APP" version)" = "$EXPECTED_VERSION"
      - name: Inspect installed Grainulator after failure
        if: failure() && matrix.app == 'grainulator'
        run: grainulator doctor --json
      - name: Remove formula
        if: always()
        run: brew uninstall "grainulation/homebrew/$APP"

  public:
    name: Public main install / ${{ matrix.app }} / macOS ARM64
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: irrigator
            version: "1.2.0"
          - app: grainulator
            version: "3.0.1"
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      APP: ${{ matrix.app }}
      EXPECTED_VERSION: ${{ matrix.version }}
      EXPECTED_TAP_SHA: ${{ github.sha }}
    steps:
      - name: Fetch public tap over the network
        run: |
          brew tap grainulation/homebrew https://github.com/grainulation/homebrew
          test "$(git -C "$(brew --repository grainulation/homebrew)" rev-parse HEAD)" = "$EXPECTED_TAP_SHA"
      - name: Install and exercise public stable formula
        run: |
          brew install "grainulation/homebrew/$APP"
          if [ "$APP" = irrigator ]; then
            app_prefix=$(brew --prefix "grainulation/homebrew/$APP")
            ruby -rjson -rdigest -e 'prefix = ARGV.fetch(0); provenance = JSON.parse(File.read("#{prefix}/share/irrigator/provenance.json")); abort "Installed Irrigator bytes differ from archive provenance" unless Digest::SHA256.file("#{prefix}/bin/irrigator").hexdigest == provenance.fetch("binary_sha256"); puts "PASS installed Irrigator binary matches archive provenance"' "$app_prefix"
          fi
          brew test --verbose "grainulation/homebrew/$APP"
          test "$("$APP" version)" = "$EXPECTED_VERSION"
      - name: Inspect installed Grainulator after failure
        if: failure() && matrix.app == 'grainulator'
        run: grainulator doctor --json
      - name: Remove formula
        if: always()
        run: brew uninstall "grainulation/homebrew/$APP"

  upgrade:
    name: Grainulator 3.0.0 to 3.0.1 / macOS ARM64
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register reviewed tap and install verified previous formula
        run: |
          brew tap grainulation/homebrew "$GITHUB_WORKSPACE"
          tap=$(brew --repository grainulation/homebrew)
          cp "$tap/Formula/grainulator.rb" "$RUNNER_TEMP/grainulator-next.rb"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/grainulation/homebrew/7aea040ba78cab30c8c8ff4d201a9885b2dd7360/Formula/grainulator.rb --output "$tap/Formula/grainulator.rb"
          ruby -rdigest -e 'abort "Previous formula changed" unless Digest::SHA256.file(ARGV.fetch(0)).hexdigest == "05341d610d9c3f2efb788a32cee273e93591cd9abc4d17ea0c0073fc3db9842f"' "$tap/Formula/grainulator.rb"
          brew install grainulation/homebrew/grainulator
          test "$(grainulator version)" = "3.0.0"
          grainulator doctor --json
      - name: Prepare user data and stable MCP registration
        run: |
          grainulator init --question "Preserve this evidence through an upgrade" --dir "$RUNNER_TEMP/user-sprint" --json
          grainulator connect --dir "$RUNNER_TEMP/user-sprint" > "$RUNNER_TEMP/connect-before.json"
          "$(brew --prefix node@24)/bin/node" --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const directory=path.join(process.env.RUNNER_TEMP,'user-sprint');
          fs.writeFileSync(path.join(directory,'user-note.txt'),'Keep this user-owned note and evidence.\n');
          const files=fs.readdirSync(directory,{recursive:true}).filter(name=>fs.lstatSync(path.join(directory,name)).isFile()).sort();
          const snapshot=Object.fromEntries(files.map(name=>[name,crypto.createHash('sha256').update(fs.readFileSync(path.join(directory,name))).digest('hex')]));
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'user-data-before.json'),JSON.stringify(snapshot));
          JS
      - name: Upgrade published archives and remove old keg
        run: |
          old_prefix=$(ruby -e 'puts File.realpath(ARGV.fetch(0))' "$(brew --prefix grainulation/homebrew/grainulator)")
          tap=$(brew --repository grainulation/homebrew)
          cp "$RUNNER_TEMP/grainulator-next.rb" "$tap/Formula/grainulator.rb"
          brew upgrade grainulation/homebrew/grainulator
          brew cleanup --prune=all grainulation/homebrew/grainulator
          test ! -e "$old_prefix"
          test "$(grainulator version)" = "3.0.1"
          grainulator doctor --json
          brew test --verbose grainulation/homebrew/grainulator
      - name: Verify preserved data and usable MCP launcher after cleanup
        run: |
          "$(brew --prefix node@24)/bin/node" --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const root=process.env.RUNNER_TEMP,directory=path.join(root,'user-sprint');
          const before=JSON.parse(fs.readFileSync(path.join(root,'user-data-before.json')));
          const files=fs.readdirSync(directory,{recursive:true}).filter(name=>fs.lstatSync(path.join(directory,name)).isFile()).sort();
          const after=Object.fromEntries(files.map(name=>[name,crypto.createHash('sha256').update(fs.readFileSync(path.join(directory,name))).digest('hex')]));
          assert.deepEqual(after,before,'Upgrade/cleanup changed user data');
          const previous=JSON.parse(fs.readFileSync(path.join(root,'connect-before.json'))).mcpServers.grainulator;
          const current=JSON.parse(execFileSync('grainulator',['connect','--dir',directory],{encoding:'utf8'})).mcpServers.grainulator;
          assert.deepEqual(current,previous,'Stable MCP registration changed');
          assert.match(current.command,/\/opt\/grainulator\/bin\/grainulator$/);
          assert.doesNotMatch(current.command,/\/Cellar\//);
          assert.match(execFileSync(current.command,[...current.args,'--help'],{encoding:'utf8'}),/One local stdio MCP server/);
          console.log('PASS public-archive 3.0.0→3.0.1 upgrade, old-keg cleanup, exact user-data preservation and stable MCP launcher');
          JS
      - name: Inspect installed Grainulator after failure
        if: failure()
        run: grainulator doctor --json
      - name: Remove formula
        if: always()
        run: brew uninstall grainulation/homebrew/grainulator
