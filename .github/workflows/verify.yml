name: Verify formulas
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homebrew:
    name: Installed stable formula / macOS ARM64
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Ruby syntax
        run: ruby -c Formula/irrigator.rb
      - name: Register exact reviewed local tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew tap grainulation/homebrew "$GITHUB_WORKSPACE"
      - name: Install and exercise stable published archive
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install grainulation/homebrew/irrigator
          brew test grainulation/homebrew/irrigator
          test "$(irrigator version)" = "1.0.0"
      - name: Remove formula
        if: always()
        run: brew uninstall grainulation/homebrew/irrigator
